</style></head><body><header class="header"><a class="logo" href="patient.html"><span class="mark">+</span><span>MediCode 健康<small>您的随身就医助手</small></span></a><nav class="topnav" aria-label="患者主导航"></nav><span class="demo-chip">患者端原型 · 演示数据</span><span class="avatar">林</span><a class="logout" href="login.html#patient">返回登录</a></header><main class="container" id="app"></main><nav class="bottom-nav" aria-label="手机底部导航"></nav><div id="toast" class="toast" role="status" hidden></div><div id="modalRoot"></div><script>
const icons={home:'m3 10 9-7 9 7 M5 9v12h14V9 M9 21v-8h6v8',calendar:'M8 2v4 M16 2v4 M3 10h18 M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2 M7 14h3 M14 14h3 M7 18h3',file:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M8 13h8 M8 17h6',user:'M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M4 22v-3a8 8 0 0 1 16 0v3',clock:'M12 8v5l3 2 M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',arrow:'M4 12h16 M14 6l6 6-6 6',check:'m5 12 4 4L19 6'};const ico=k=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[k]}"/></svg>`;let route='home',day='09/12',time='09:00',bookedDay='09/11',bookedTime='09:15',arrived=false,booked=true,timer,lastFocus;const navs=[['home','首页','home'],['booking','预约挂号','calendar'],['records','就诊记录','file'],['profile','我的','user']];function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(timer);timer=setTimeout(()=>el.hidden=true,3600)}const head=(e,t,s)=>`<div class="heading"><div><div class="eyebrow">${e}</div><h1>${t}</h1></div><span class="sub">${s}</span></div>`;const foot=()=>'<div class="footer"><span>MediCode 健康 · 让每一步就医更清楚</span><span>设计预览 · 人物、地点及数据均为虚构，不构成医疗建议。</span></div>';
function home(){return head('YOUR HEALTH SPACE','您好，林女士','今天也照顾好自己')+`<div class="greeting"><section class="welcome"><h2>让就医更简单，<br>让关怀更贴近。</h2><p>您的预约与就诊信息，随时清晰可见。</p><svg class="welcome-art" viewBox="0 0 180 180" aria-hidden="true"><circle cx="97" cy="89" r="69" fill="#c7e6df"/><rect x="39" y="40" width="99" height="109" rx="14" fill="#f4fcf9" transform="rotate(-10 89 95)"/><path d="M89 59v48 M65 83h48" stroke="#83bfae" stroke-width="13" stroke-linecap="round"/><path d="M64 125h52" stroke="#bddfD4" stroke-width="5" stroke-linecap="round"/></svg></section><section class="health-hint"><h3>就诊前，准备好这三件事</h3><p>01　携带有效证件<br>02　带上既往检查和用药资料<br>03　提前确认时间与诊区位置</p></section></div><div class="shortcut-grid">${[['calendar','预约挂号','选择合适的时段','booking'],['file','就诊记录','查看已归档记录','records'],['clock','就诊报到','了解下一步安排','checkin'],['user','我的档案','管理个人信息','profile']].map(x=>`<button class="shortcut" data-go="${x[3]}"><span>${ico(x[0])}</span><div><b>${x[1]}</b><small>${x[2]}</small></div></button>`).join('')}</div><div class="main-grid"><section class="card"><div class="card-head"><h2>我的预约</h2><span class="badge ${arrived?'green':''}">${!booked?'已取消':arrived?'已报到 · 演示':'待就诊'}</span></div><div class="doc"><span class="avatar">陈</span><div><b>陈医生 <span style="font-size:10px;color:#94a3b1;font-weight:400">主治医师</span></b><small>全科医学科 · 普通门诊</small></div></div><div class="details"><span>${ico('calendar')} ${bookedDay.replace('/',' 月 ')} 日　${bookedTime}</span><span>${ico('home')} 门诊楼 2 层 · 全科诊区</span><span>${ico('user')} 就诊人：林女士 · 虚构档案</span></div><div class="card-actions"><button class="btn" data-go="booking">${booked?'重新选择时段':'重新预约'}</button><button class="btn primary" data-go="${booked?'checkin':'booking'}">${booked?'查看报到指引':'选择预约时段'} ${ico('arrow')}</button></div></section><section class="card"><div class="card-head"><h2>最近就诊</h2><button style="color:var(--blue);font-size:11px" data-go="records">全部记录 →</button></div><div class="record"><span class="record-icon">${ico('file')}</span><div><b>全科门诊</b><small>陈医生 · 常规健康评估<br><span class="badge green">已归档 · 示例</span></small></div><span class="date">08.18</span></div><div class="record"><span class="record-icon">${ico('file')}</span><div><b>健康随访</b><small>陈医生 · 定期随访<br><span class="badge green">已归档 · 示例</span></small></div><span class="date">07.22</span></div></section></div><div class="info">温馨提示：请以实际医院和医生的安排为准。此原型用于体验预约、报到和记录查看的交互流程。</div>`+foot()}
function booking(){return head('APPOINTMENT','预约挂号','示例科室与号源')+`<div class="steps"><span class="on"><b>1</b>选择医生与时间</span><span><b>2</b>核对预约信息</span><span><b>3</b>查看预约结果</span></div><div class="booking-grid"><section class="card"><div class="card-head"><h2>选择就诊时段</h2><span class="badge green">全科医学科</span></div><div class="doc"><span class="avatar">陈</span><div><b>陈医生 · 主治医师</b><small>普通门诊 · 门诊楼 2 层</small></div></div><div class="days">${['09/12','09/13','09/14','09/15','09/16'].map((d,i)=>`<button class="${day===d?'selected':''}" data-day="${d}">${['周六','周日','周一','周二','周三'][i]}<br>${d}<small>有号 · 演示</small></button>`).join('')}</div><h3 style="font-size:12px;font-weight:500">上午门诊</h3><div class="times">${['09:00','09:30','10:00','10:30','11:00','11:30'].map(t=>`<button class="${time===t?'selected':''}" data-time="${t}">${t}</button>`).join('')}</div><div class="info">这里展示预约交互；正式系统需实时校验余号，并在一次事务中完成扣号与预约创建。</div></section><aside class="card"><div class="card-head"><h2>核对预约</h2></div><div class="field"><span>就诊人</span><b>林女士（虚构）</b></div><div class="field"><span>科室 / 医生</span><b>全科 / 陈医生</b></div><div class="field"><span>预约日期</span><b>${day}</b></div><div class="field"><span>预约时间</span><b>${time}</b></div><div class="field"><span>地点</span><b>门诊楼 2 层</b></div><p class="summary-note">核对日期和时间后，进入演示确认。操作不会写入真实数据库或产生挂号费用。</p><button class="btn primary" style="width:100%" data-go="confirmBooking">确认演示预约 ${ico('arrow')}</button></aside></div>`+foot()}
function records(){return head('MEDICAL RECORDS','我的就诊记录','仅展示虚构数据')+`<section class="card"><div class="card-head"><h2>已归档记录</h2><span class="badge green">2 份示例</span></div>${[['08.18','全科门诊','常规健康评估'],['07.22','健康随访','定期健康随访']].map(x=>`<div class="record"><span class="record-icon">${ico('file')}</span><div style="flex:1"><b>${x[1]}</b><small>2026.${x[0]} · 陈医生<br>${x[2]} · 非真实诊疗结论</small></div><button class="btn" data-go="recordDetail">查看详情</button></div>`).join('')}</section><div class="info">正式系统只显示当前登录患者获准查看的记录。未发布的诊疗信息不应因页面入口变化而提前可见。</div>`+foot()}
function profile(){return head('MY ACCOUNT','我的健康空间','个人信息与服务')+`<section class="card"><div class="profile-card"><span class="avatar" style="width:60px;height:60px;font-size:22px">林</span><div><h2>林女士</h2><p>患者演示账号 · 未绑定真实身份</p></div></div><div class="profile-menu">${[['个人资料','myDetails'],['就诊人管理','family'],['账号与密码','accountHelp'],['预约管理','booking'],['帮助与说明','help']].map(x=>`<button data-go="${x[1]}">${x[0]}<span style="color:#a7b7bf">›</span></button>`).join('')}</div><a class="btn" style="margin-top:23px;color:#698792" href="login.html#patient">退出演示，返回患者登录</a></section>`+foot()}
function render(r){route=['home','booking','records','profile'].includes(r)?r:'home';document.getElementById('app').innerHTML=({home,booking,records,profile}[route])();document.querySelector('.topnav').innerHTML=navs.map(n=>`<button data-go="${n[0]}" class="${route===n[0]?'active':''}">${n[1]}</button>`).join('');document.querySelector('.bottom-nav').innerHTML=navs.map(n=>`<button data-go="${n[0]}" class="${route===n[0]?'active':''}">${ico(n[2])}${n[1]==='预约挂号'?'预约':n[1]==='就诊记录'?'记录':n[1]}</button>`).join('');history.replaceState(null,'','#'+route);window.scrollTo(0,0)}function closeModal(){document.getElementById('modalRoot').innerHTML='';if(lastFocus?.isConnected)lastFocus.focus()}function modal(title,text,confirm='知道了',callback=null){lastFocus=document.activeElement;document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h2 id="dialogTitle">${title}</h2><p>${text}</p><button class="btn primary" id="modalConfirm">${confirm}</button><button class="btn" id="modalCancel">返回</button></section></div>`;document.getElementById('modalConfirm').onclick=()=>{closeModal();callback?.()};document.getElementById('modalCancel').onclick=closeModal;document.getElementById('modalCancel').focus()}
function go(r){if(navs.some(n=>n[0]===r)){render(r);return}if(r==='confirmBooking'){modal('确认本次演示预约',`${day} ${time}<br>陈医生 · 全科医学科<br>就诊人：林女士（虚构）<br>本次操作仅更新页面中的演示预约。`,'确认',()=>{bookedDay=day;bookedTime=time;booked=true;arrived=false;render('home');toast('演示预约已更新，请查看首页预约卡片。')});return}if(r==='checkin'){modal('就诊报到指引','请携带有效证件与既往检查资料，到门诊楼 2 层全科诊区核实报到。<br>以上地点和流程为虚构示例。','演示已报到',()=>{arrived=true;render('home');toast('已更新演示报到状态。')});return}if(r==='recordDetail'){modal('就诊记录 · 详情示例','全科门诊 · 陈医生<br>此处正式展示主诉、医生已确认的诊疗结论和处置信息。<br>当前没有真实病历内容，不提供医学判断。');return}const texts={myDetails:['个人资料','正式系统提供本人信息查看、修改与必要身份核验。此处不收集真实身份信息。'],family:['就诊人管理','正式实现需要明确监护、代办与被授权访问关系。当前只有林女士一份虚构档案。'],accountHelp:['账号与密码','账号修改和密码重置需完成本人身份核验。当前原型不处理真实密码。'],help:['关于这个原型','可体验患者首页、预约选择、确认、报到、记录列表和个人中心。所有数据均为虚构。']};if(texts[r])modal(...texts[r])}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}const d=e.target.closest('[data-day]');if(d){day=d.dataset.day;render('booking');return}const t=e.target.closest('[data-time]');if(t){time=t.dataset.time;render('booking')}});document.addEventListener('keydown',e=>{const m=document.querySelector('.modal');if(!m)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const f=[...m.querySelectorAll('button')];if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}}});window.addEventListener('hashchange',()=>render(location.hash.slice(1)));render(location.hash.slice(1)||'home');
</script></body></html>
