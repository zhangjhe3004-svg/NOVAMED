<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVAMED · 功能页 UI 设计</title>
<style>
:root{--blue:#2563eb;--navy:#142d53;--ink:#1b2b45;--muted:#78869b;--line:#e6ecf3;--bg:#f4f7fb;--teal:#138d85;--gold:#d6a451;--red:#d9534f;--radius:14px;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);font-size:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #78a8ff;outline-offset:3px}
svg{vertical-align:middle}.icon{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.icon.sm{width:15px;height:15px}

/* ---- shell ---- */
.shell{display:flex;min-height:100vh}
.sidebar{width:232px;background:#fff;border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:30;padding:28px 17px 20px;overflow-y:auto}
.brand{display:flex;gap:11px;align-items:center;padding:0 11px 24px}.brand-symbol{width:35px;height:37px;background:var(--blue);border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:29px}.brand b{font-size:23px;letter-spacing:-.8px}.brand small{display:block;font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:3px}
.nav-label{font-size:10px;letter-spacing:1.6px;color:#9aa6b5;margin:16px 14px 8px}
.nav-item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 15px;border-radius:9px;margin:2px 0;color:#63718a;font-size:13px}.nav-item:hover{background:#f5f8fd}.nav-item.active{background:#eaf1ff;color:var(--blue);font-weight:600}.nav-item .count{font-size:10px;margin-left:auto;background:#dde8ff;padding:2px 6px;border-radius:5px}.nav-item .count.red{background:#fde8e8;color:#c4423e}
.sidebar-foot{margin-top:auto;padding:18px 10px 0}.side-footer{display:flex;align-items:center;gap:8px;color:#8996a8;font-size:11px}.dot{width:6px;height:6px;background:var(--teal);display:inline-block;border-radius:50%}
.main{margin-left:232px;width:calc(100% - 232px);min-width:0}
.topbar{height:78px;background:#ffffffec;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 34px;gap:20px;position:sticky;top:0;z-index:20;backdrop-filter:blur(10px)}
.breadcrumb{font-size:12px;color:#8b96a7;white-space:nowrap}.breadcrumb b{color:var(--ink);font-weight:500;margin-left:10px}.breadcrumb i{font-style:normal;margin-left:10px;color:#b6c0cf}
.search{margin-left:auto;display:flex;align-items:center;gap:9px;background:#f6f8fc;border:1px solid #edf1f7;border-radius:8px;padding:8px 12px;color:#9aa6b6;width:225px}.search input{width:100%;border:0;outline:0;background:none;font-size:12px;color:var(--ink)}.search kbd{font-size:10px;background:#fff;border:1px solid var(--line);padding:2px 5px;border-radius:4px}
.preview-label{padding:5px 9px;background:#fff7e7;color:#947034;border-radius:5px;font-size:10px;white-space:nowrap}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;position:relative}.icon-btn:hover{background:#eef3fb}.icon-btn .pip{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red);border:2px solid #fff}
.profile{display:flex;align-items:center;gap:9px;border-left:1px solid var(--line);padding-left:19px;font-size:12px}.profile small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#eaf1ff;color:#4774b9;font-size:12px;font-weight:600;flex-shrink:0}.avatar.sq{border-radius:9px;background:#edf3fb;color:#7891b4}.avatar.lg{width:64px;height:64px;font-size:22px;border-radius:18px}.avatar.teal{background:#e6f4f1;color:#1f8a7e}.avatar.gold{background:#fbf2df;color:#a8792a}.avatar.navy{background:var(--navy);color:#fff}
.content{max-width:1570px;padding:31px 34px 26px;margin:auto}
.page-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:16px}.eyebrow{font-size:10px;letter-spacing:2px;color:#8795aa;margin-bottom:8px}.page-heading h1{font-size:26px;letter-spacing:-.8px;margin:0 0 9px;font-weight:650}.sub{font-size:12px;color:var(--muted);line-height:1.8}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.footer{display:flex;justify-content:space-between;color:#9eabbc;font-size:10px;padding-top:20px}

/* ---- primitives ---- */
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;padding:10px 15px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px;font-weight:500;white-space:nowrap}.btn:hover{border-color:#b1c8ec;background:#f9fbff}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 8px #2563eb15}.btn.primary:hover{background:#1f54c4}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}.btn.danger{color:#c4423e;border-color:#f2d4d3;background:#fff8f8}.btn.quiet{border-color:transparent;background:none;color:var(--blue);padding:5px 0}.btn.sm{padding:6px 10px;font-size:11px}.btn.block{width:100%}
.badge{display:inline-flex;gap:5px;align-items:center;padding:4px 8px;border-radius:5px;font-size:10px;background:#eff6ff;color:#5487d3;white-space:nowrap}.badge.green{background:#edf8f4;color:#298f70}.badge.amber{background:#fff7e9;color:#b88c38}.badge.gray{background:#f0f3f7;color:#7d8ba0}.badge.red{background:#fdeeee;color:#c4423e}.badge.navy{background:#e4eaf4;color:#2d4a74}.badge.teal{background:#e6f4f1;color:#1f8a7e}.badge.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);min-width:0;overflow:hidden}
.panel-head{padding:19px 22px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.panel-head h2{font-size:14px;margin:0;font-weight:650}.panel-head small{font-size:10px;color:var(--muted);display:block;margin-top:6px}.panel-body{padding:0 22px 20px}.panel-body.pad{padding-top:6px}
.segmented{display:flex;background:#f4f7fb;padding:3px;border-radius:7px;gap:2px}.segmented button{font-size:10px;padding:5px 10px;border-radius:5px;color:#8490a2;white-space:nowrap}.segmented button.selected{background:#fff;color:var(--ink);box-shadow:0 1px 5px #172b4d0c;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 22px}.tabs button{padding:12px 10px;font-size:12px;color:#7d8ba0;border-bottom:2px solid transparent;margin-bottom:-1px}.tabs button.active{color:var(--blue);border-color:var(--blue);font-weight:600}.tabs .n{font-size:10px;background:#eef3fb;padding:1px 6px;border-radius:4px;margin-left:6px}
.toolbar{display:flex;gap:10px;padding:0 22px 16px;flex-wrap:wrap;align-items:center}.toolbar .input{flex:1;min-width:220px}
.input{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:9px 12px;border-radius:8px;background:#fff;font-size:12px;color:#5c6d86;min-width:0}.input.select::after{content:"⌄";margin-left:auto;color:#9aa6b6;font-size:14px;line-height:0}.input input{border:0;outline:0;width:100%;background:none;color:var(--ink)}.input .ph{color:#9aa6b6}
.field{margin:0 0 16px}.field label{display:block;font-size:12px;font-weight:600;margin-bottom:8px}.field .hint{font-size:10px;color:#9aa6b6;margin-top:6px}.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px;resize:vertical;line-height:1.8;min-height:78px;font-size:12px;color:#5c6d86;background:#fcfdff}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}th{font-size:10px;color:#8b98aa;font-weight:500;text-align:left;background:#f9fbfd;padding:12px 20px;white-space:nowrap}td{padding:14px 20px;border-top:1px solid #f1f4f8;white-space:nowrap;vertical-align:middle}tbody tr:hover{background:#fcfdff}tbody tr.selected{background:#f3f7ff;box-shadow:inset 3px 0 var(--blue)}td.wrap{white-space:normal;min-width:180px;line-height:1.6}
.person{display:flex;gap:10px;align-items:center}.person small{display:block;color:#9aa6b7;font-size:10px;margin-top:4px}.muted{color:#8290a4}.row-link{color:var(--blue);font-size:11px;margin-right:10px}.row-link.danger{color:#c4423e}
.table-foot{display:flex;justify-content:space-between;align-items:center;color:#9ba8b7;font-size:10px;padding:14px 21px;border-top:1px solid var(--line)}.pager{display:flex;gap:4px}.pager span{padding:3px 8px;border-radius:4px;background:#f3f6fa}.pager span.cur{background:#edf3ff;color:var(--blue)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:21px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;transition:transform .15s,border-color .15s}.stat:hover{transform:translateY(-2px);border-color:#bdd1ee}.stat-top{display:flex;align-items:center;justify-content:space-between;color:#75839a;font-size:12px}.stat-icon{width:33px;height:33px;border-radius:9px;display:grid;place-items:center;color:var(--blue);background:#eff5ff;flex-shrink:0}.stat-icon.teal{color:var(--teal);background:#edf8f5}.stat-icon.gold{color:#b98b3b;background:#fcf5e9}.stat-icon.red{color:#c4423e;background:#fdeeee}.stat-icon.navy{color:#2d4a74;background:#e4eaf4}.stat-value{font-size:27px;font-weight:650;letter-spacing:-.8px;margin:6px 0 8px;font-variant-numeric:tabular-nums}.stat-bottom{color:#91a0b2;font-size:10px}.stat-bottom em{font-style:normal;color:var(--teal);margin-right:5px}.stat-bottom em.warn{color:#b88c38}
.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr);gap:21px;align-items:start}.split.even{grid-template-columns:1fr 1fr}.split.left{grid-template-columns:250px minmax(0,1fr)}.split.wide{grid-template-columns:minmax(0,2.3fr) minmax(300px,1fr)}.stack>*+*{margin-top:21px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;font-size:12px}.kv dt{color:#8b98aa;font-size:11px}.kv dd{margin:0}
.list{padding:0 22px 8px}.list-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #f0f3f8;width:100%;text-align:left}.list-item:last-child{border-bottom:0}.list-item strong{font-size:12px;font-weight:600;display:block}.list-item p{font-size:10px;color:#8d9aae;margin:5px 0 0;line-height:1.6}.list-item .right{margin-left:auto;text-align:right;font-size:10px;color:#8d9aae;flex-shrink:0}
.side-list button{display:flex;gap:11px;align-items:center;width:100%;text-align:left;padding:13px 16px;border-top:1px solid #f0f3f8;font-size:12px}.side-list button:first-of-type{border-top:0}.side-list button.selected{background:#eef4ff;box-shadow:inset 3px 0 var(--blue)}.side-list small{display:block;font-size:10px;color:#929eb0;margin-top:5px}.side-list .cnt{margin-left:auto;font-size:10px;background:#f0f3f7;color:#6c7a90;padding:2px 7px;border-radius:5px}.side-list .cnt.hot{background:#fde8e8;color:#c4423e}
.bar{height:6px;border-radius:4px;background:#edf1f7;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--blue);border-radius:4px}.bar i.teal{background:var(--teal)}.bar i.gold{background:var(--gold)}.bar i.red{background:#e26a66}.bar-row{display:flex;align-items:center;gap:9px;font-size:11px;color:#6c7a90}.bar-row b{min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.timeline{position:relative;padding-left:22px}.timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1px;background:#e3e9f2}.tl{position:relative;padding:0 0 18px}.tl::before{content:"";position:absolute;left:-20px;top:4px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #bccbe4}.tl.done::before{border-color:var(--teal);background:var(--teal)}.tl.now::before{border-color:var(--blue);background:var(--blue);box-shadow:0 0 0 4px #2563eb22}.tl b{font-size:12px;font-weight:600;display:block}.tl span{font-size:10px;color:#8d9aae;display:block;margin-top:4px;line-height:1.7}
.steps{display:flex;align-items:center;gap:8px;font-size:11px;color:#8d9aae}.steps .st{display:flex;align-items:center;gap:7px}.steps .st i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;background:#eef2f8;color:#8d9aae}.steps .st.done i{background:var(--teal);color:#fff}.steps .st.now i{background:var(--blue);color:#fff}.steps .st.now{color:var(--ink);font-weight:600}.steps .ln{flex:1;height:1px;background:#e3e9f2;min-width:18px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:11px;background:#f1f5fb;color:#4b5f7f;border:1px solid transparent;margin:0 6px 6px 0}.chip.on{background:#eaf1ff;color:var(--blue);border-color:#c9daf8}.chip.teal{background:#e6f4f1;color:#1f8a7e}
.toggle{width:34px;height:20px;border-radius:999px;background:#d7dfeb;position:relative;flex-shrink:0;display:inline-block}.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0002;transition:.15s}.toggle.on{background:var(--blue)}.toggle.on::after{left:16px}
.note{font-size:10px;color:#9a8b73;background:#fffcf6;border:1px solid #f5ecd8;border-radius:8px;padding:11px 13px;line-height:1.9}.note.blue{color:#416795;background:#f4f8ff;border-color:#e2ebfa}.note.red{color:#a4403d;background:#fff6f6;border-color:#f5d9d8}
.alert{padding:11px 13px;background:#fff8ed;border:1px solid #f5e8cc;border-radius:7px;color:#aa8136;font-size:11px;display:flex;gap:8px;align-items:center}
.empty{padding:36px;text-align:center;color:var(--muted);font-size:12px}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{background:#f7f9fc;border-radius:10px;padding:12px 14px}.mini small{font-size:10px;color:#8b98aa;display:block}.mini b{font-size:18px;display:block;margin-top:5px;letter-spacing:-.4px}.mini b span{font-size:10px;color:#8b98aa;font-weight:400;margin-left:4px}

/* ---- page specific ---- */
.hero-card{background:var(--navy);color:#fff;border-radius:var(--radius);padding:22px 26px;display:flex;gap:18px;align-items:center}.hero-card h2{margin:0 0 6px;font-size:18px;font-weight:600}.hero-card p{margin:0;color:#b3c7e1;font-size:11px;line-height:1.8}.hero-card .avatar{background:#ffffff1c;color:#fff}
.conf{display:flex;align-items:center;gap:10px}.conf .bar{flex:1}
.dx{padding:14px 0;border-bottom:1px solid #f0f3f8}.dx:last-child{border-bottom:0}.dx-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}.dx-head b{font-size:13px}.dx-head .pct{margin-left:auto;font-weight:650;font-variant-numeric:tabular-nums}.dx p{margin:7px 0 0;font-size:11px;color:#7d8ba0;line-height:1.7}
.ref{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #f0f3f8;font-size:11px;line-height:1.7}.ref:last-child{border-bottom:0}.ref b{display:block;color:#2d527e;font-weight:600;font-size:12px}.ref .src{color:#8d9aae;font-size:10px}
.chat{display:grid;grid-template-columns:290px minmax(0,1fr) 260px;min-height:640px}.chat>*{border-right:1px solid var(--line)}.chat>*:last-child{border-right:0}
.convo{display:flex;gap:11px;width:100%;text-align:left;padding:14px 18px;border-bottom:1px solid #f0f3f8;align-items:flex-start}.convo.selected{background:#eef4ff}.convo b{font-size:12px;display:flex;justify-content:space-between}.convo b span{font-weight:400;font-size:10px;color:#9aa6b6}.convo p{margin:5px 0 0;font-size:11px;color:#8290a4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}.convo .unread{min-width:17px;height:17px;border-radius:9px;background:var(--blue);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 5px;margin-left:6px}
.thread{display:flex;flex-direction:column}.thread-head{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.thread-head b{font-size:13px;display:block}.thread-head small{font-size:10px;color:var(--muted)}.msgs{flex:1;padding:22px;display:flex;flex-direction:column;gap:14px;background:#fafbfd}.msg{display:flex;gap:10px;max-width:78%}.msg.me{align-self:flex-end;flex-direction:row-reverse}.bubble{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 13px;font-size:12px;line-height:1.75}.msg.me .bubble{background:var(--blue);color:#fff;border-color:var(--blue)}.msg time{display:block;font-size:10px;color:#9aa6b6;margin-top:5px}.msg.me time{text-align:right}.sys{align-self:center;font-size:10px;color:#9aa6b6;background:#eef2f8;padding:4px 12px;border-radius:999px}
.record-card{background:#fff;border:1px solid #dbe6fa;border-radius:10px;padding:10px 12px;margin-top:8px;display:flex;gap:10px;align-items:center;color:var(--ink)}.record-card small{display:block;color:#8d9aae;font-size:10px;margin-top:3px}
.composer{border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;align-items:center}.composer .input{flex:1}
.week{display:grid;grid-template-columns:150px repeat(7,1fr);font-size:11px}.week>div{padding:10px 8px;border-bottom:1px solid #f0f3f8;border-right:1px solid #f4f6fa;min-height:62px}.week .h{background:#f9fbfd;color:#8b98aa;font-size:10px;min-height:0;padding:11px 8px;text-align:center}.week .h b{display:block;color:var(--ink);font-size:12px;margin-top:3px}.week .h.today{color:var(--blue)}.week .h.today b{color:var(--blue)}.week .who{display:flex;gap:9px;align-items:center}.week .who small{display:block;color:#9aa6b6;font-size:10px;margin-top:3px}
.shift{display:block;font-size:10px;padding:5px 7px;border-radius:6px;margin-bottom:4px;background:#eaf1ff;color:#2f5fc4;border-left:3px solid var(--blue)}.shift.pm{background:#e6f4f1;color:#1f7a6e;border-color:var(--teal)}.shift.night{background:#e4eaf4;color:#2d4a74;border-color:var(--navy)}.shift.off{background:#f3f5f8;color:#9aa6b6;border-color:#cfd7e2}.shift.leave{background:#fff4e5;color:#a8792a;border-color:var(--gold)}
.legend{display:flex;gap:16px;font-size:10px;color:#8190a4;align-items:center}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.article h2{font-size:20px;margin:0 0 10px;letter-spacing:-.4px}.article .meta{font-size:11px;color:#8d9aae;display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}.article p{font-size:12px;line-height:2;color:#3f506b;margin:0 0 12px}.article h4{font-size:13px;margin:18px 0 8px}.attach{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:11px;margin-right:8px}
.org-tree button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 14px;font-size:12px;color:#5c6d86;border-radius:7px}.org-tree button.l2{padding-left:34px}.org-tree button.l3{padding-left:52px;font-size:11px}.org-tree button.active{background:#eaf1ff;color:var(--blue);font-weight:600}
.dept-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.dept{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.dept-top{display:flex;gap:11px;align-items:center;margin-bottom:14px}.dept-top b{font-size:14px;display:block}.dept-top small{font-size:10px;color:var(--muted)}.dept .kv{font-size:11px}.dept-foot{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);display:flex;gap:-6px;align-items:center;font-size:10px;color:#8d9aae}.faces{display:flex;margin-right:10px}.faces .avatar{width:26px;height:26px;font-size:10px;border:2px solid #fff;margin-left:-8px}.faces .avatar:first-child{margin-left:0}
.cat button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;border-radius:8px;font-size:12px;color:#5c6d86}.cat button.active{background:#eaf1ff;color:var(--blue);font-weight:600}.cat .cnt{margin-left:auto;font-size:10px;color:#9aa6b6}
