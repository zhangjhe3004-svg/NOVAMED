function modal(title,body,actionLabel='知道了',onConfirm=null){modalReturnFocus=document.activeElement;document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">${title}</h2>${body}<div class="modal-actions"><button class="btn" id="modalClose">关闭</button><button class="btn primary" id="modalConfirm">${actionLabel}</button></div></section></div>`;const close=()=>{document.getElementById('modalRoot').innerHTML='';modalReturnFocus?.focus()};document.getElementById('modalClose').onclick=close;document.getElementById('modalConfirm').onclick=()=>{if(onConfirm&&onConfirm()===false)return;close()};document.getElementById('modalClose').focus()}
function filterPatients(value){const list=people.filter(p=>[p.name,p.id,p.symptom].some(x=>x.toLowerCase().includes(value.toLowerCase())));document.getElementById('patientRows').innerHTML=list.length?patientRows(list):'<tr><td colspan="6" class="empty">没有匹配的演示档案，请尝试其他关键词。</td></tr>';document.getElementById('resultCount').textContent=`找到 ${list.length} 份演示档案`}
const actions={date:()=>modal('统计时间范围','<p>当前概览使用 2026 年 9 月 11 日的虚构数据。可点击趋势图右上角的“本周 / 本月”比较不同展示效果。</p>'),notification:()=>modal('今日通知','<p>3 份 AI 建议等待确认</p><p>2 份病历草稿待完善</p><p>以上仅用于展示通知交互。</p>','进入工作台',()=>navigate('workbench')),guide:()=>modal('欢迎评审 MediCode 新设计','<p>可体验总览控制台、患者列表、医生工作台和患者移动端。支持患者搜索、切换接诊对象、保存提示、时间范围切换与预约示例。</p><p>所有人物和数据均为虚构；当前原型不会访问或修改真实系统。</p>'),density:()=>{document.body.classList.toggle('compact');toast(document.body.classList.contains('compact')?'已切换为紧凑密度':'已切换为舒适密度')},knowledge:()=>modal('医学知识库 · 设计方向','<p>知识文档展示来源、版本、审核状态与引用信息。真实系统中应支持检索与原文核查。</p><div class="evidence"><b>知识卡片示例</b><br>标题：全科问诊记录规范（虚构）<br>状态：示例草稿 · 不作为临床依据</div>'),clearSearch:()=>{document.getElementById('patientSearch').value='';filterPatients('')},newPatient:()=>modal('新增患者 · 表单预览','<p>展示创建档案的交互，不会写入数据库。</p><div class="field"><label for="demoName">患者姓名</label><input id="demoName" placeholder="填写演示姓名" maxlength="30"></div><div class="field"><label for="demoPhone">联系电话（可选）</label><input id="demoPhone" placeholder="仅用于预览" maxlength="20"></div>','预览提交',()=>{if(!document.getElementById('demoName').value.trim()){document.getElementById('demoName').focus();toast('请先填写演示姓名');return false}toast('表单校验通过，演示模式未创建真实档案')}),saveDraft:()=>toast('草稿保存交互已演示，内容未写入真实系统'),complete:()=>modal('完成本次接诊','<p>正式系统应检查必填病历、医生确认状态与数据版本。此处仅演示确认流程。</p>','确认演示',()=>toast('接诊完成交互已演示')),analyze:()=>{document.getElementById('aiResult').classList.toggle('hidden');toast('已切换 AI 分析示例展示')},evidence:()=>modal('证据核查 · 展示示例','<p>真实结果应包含文档标题、来源、版本、引用片段与定位信息。</p><div class="evidence"><b>来源状态</b><br>本原型未连接医学资料库，无实际医学引用。不能据此作出诊疗判断。</div>'),booking:()=>{modal('选择预约时段','<p>陈医生 · 全科医学科<br>09 月 12 日（周六） · 以下为演示号源</p><div class="day-grid"><button class="selected" data-slot="09:00">09:00</button><button data-slot="09:30">09:30</button><button data-slot="10:00">10:00</button></div>','确认演示预约',()=>{const slot=document.querySelector('[data-slot].selected').dataset.slot;if(document.getElementById('appointmentDate'))document.getElementById('appointmentDate').textContent='09 月 12 日（周六） '+slot;toast('已更新原型中的预约卡片，未创建真实预约')})},checkin:()=>modal('就诊报到指引','<p>1. 携带有效证件与既往检查资料。</p><p>2. 到达门诊楼 2 层全科诊区。</p><p>3. 向诊区工作人员核实报到信息。</p><p>当前为虚构地点和流程示例。</p>','演示报到',()=>{const el=document.getElementById('appointmentStatus');if(el){el.textContent='已报到 · 演示';el.className='badge green'}toast('报到状态已在原型中更新')}),myRecords:()=>modal('我的就诊记录','<div class="evidence"><b>2026.08.18 · 全科门诊</b><br>常规健康评估 · 记录已归档（虚构）</div><p>正式系统仅向登录患者展示其本人获准查看的记录。</p>'),myProfile:()=>modal('我的健康档案','<div class="evidence"><b>林女士 · 演示账号</b><br>个人信息、就诊人管理、账号设置</div><p>此处无真实身份信息。</p>'),patientHome:()=>navigate('patient')};
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){navigate(nav.dataset.page);return}const p=e.target.closest('[data-patient]');if(p){selectedPatient=Number(p.dataset.patient);navigate('workbench');return}const r=e.target.closest('[data-range]');if(r){range=r.dataset.range;document.getElementById('chartRegion').innerHTML=chart();document.querySelectorAll('[data-range]').forEach(b=>b.classList.toggle('selected',b.dataset.range===range));return}const slot=e.target.closest('[data-slot]');if(slot){document.querySelectorAll('[data-slot]').forEach(b=>b.classList.toggle('selected',b===slot));return}const a=e.target.closest('[data-action]');if(a)actions[a.dataset.action]?.()});
document.addEventListener('input',e=>{if(e.target.id==='patientSearch')filterPatients(e.target.value.trim())});
document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();const val=document.getElementById('globalSearch').value.trim();const hit=Object.keys(names).find(k=>names[k].includes(val));if(val&&hit){navigate(hit);return}navigate('patients');document.getElementById('patientSearch').value=val;filterPatients(val)};
document.getElementById('menuToggle').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.addEventListener('keydown',e=>{const m=document.querySelector('.modal');if(!m)return;if(e.key==='Escape')document.getElementById('modalClose').click();if(e.key==='Tab'){const f=[...m.querySelectorAll('button,input')];if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}}});
window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));navigate(location.hash.slice(1)||'dashboard');icons();
</script>
<script>
document.querySelector('.sidebar nav').insertAdjacentHTML('beforeend','<a class="nav-item" href="login.html">'+icon('shield')+'员工 / 患者登录</a><a class="nav-item" href="patient.html">'+icon('phone')+'患者端完整预览 ↗</a><a class="nav-item" href="pages.html">'+icon('grid')+'功能页 UI 设计 ↗</a>');
document.querySelector('.sidebar').style.overflowY='auto';
const originalNavigate=navigate;
navigate=function(next){originalNavigate(next);let selected=false;document.querySelectorAll('.nav-item').forEach(b=>{const active=!selected&&b.dataset.page===page;b.classList.toggle('active',active);if(active)selected=true})};
navigate(page);
</script>
