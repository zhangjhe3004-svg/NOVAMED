services:
  backend:
    build: ./backend
    ports:
      - "18001:18001"
    environment:
      - BACKEND_PORT=18001
      - STORAGE_DATABASE_URL=postgresql+psycopg2://medicode:medicode@pgbouncer:6432/medicode_storage
    volumes:
      - ./backend/data:/app/data
    depends_on:
      - mongo
      - postgres
      - pgbouncer
  frontend:
    build: ./frontend
    ports:
      - "3051:3051"
    depends_on:
      - backend
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: medicode
      POSTGRES_PASSWORD: medicode
      POSTGRES_DB: medicode_storage
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
  pgbouncer:
    image: edoburu/pgbouncer
    environment:
      DB_HOST: postgres
      DB_USER: medicode
      DB_PASSWORD: medicode
      DB_NAME: medicode_storage
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "5000"
      DEFAULT_POOL_SIZE: "50"
    ports:
      - "6432:6432"
    depends_on:
      - postgres
volumes:
  mongo_data:
  pg_data:
